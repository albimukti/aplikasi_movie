services:
  # 1. Backend API Service (Go Fiber Gateway connected to Neon PostgreSQL)
  - type: web
    name: moviehub-backend-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_pKt4Ffj7GXEe@ep-morning-darkness-b4yhq372-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Static Site (React Vite Cinema SPA)
  - type: web
    name: moviehub-frontend-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://moviehub-backend-api.onrender.com/api/v1
